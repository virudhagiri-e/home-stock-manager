services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: homestock
      POSTGRES_PASSWORD: homestock
      POSTGRES_DB: home_stock
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homestock -d home_stock']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
